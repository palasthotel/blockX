name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # The plugin: php -l, build, pack with payload assertions, version carriers.
  plugin:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@v1
    with:
      slug: blockx
      root: wp-plugin
      dev-plugin-name: BlockX - DEV
      # README.txt declares Requires PHP: 8.1
      php-versions: '["8.1", "8.2", "8.3", "8.4"]'
      # The editor bundle imports @palasthotel/blockx, which npm resolves to the
      # npm-package workspace - so install and build from the repository root,
      # library first. The command runs in wp-plugin/.
      build-command: cd .. && npm ci && npm run build
      # What Assets.php and Gutenberg.php load: a renamed build output fails here
      # instead of as a 404 in the editor.
      required-files: |
        assets/dist/gutenberg.js
        assets/dist/gutenberg.asset.php
        assets/dist/gutenberg.css
        assets/block/block.json
        assets/container/block.json
        assets/composedBlock/block.json
        assets/slot/block.json
        vendor/autoload.php
        languages/blockx-de_DE.mo

  npm-package:
    name: npm package (type check, build, exports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit over npm-package/src with strict, noUnusedLocals and
      # noUnusedParameters. The plugin bundle is JavaScript and its @wordpress
      # imports are externalised, so this is the only type check in the repository.
      - name: Lint
        run: npm run lint --workspace @palasthotel/blockx

      - name: Build
        run: npm run build --workspace @palasthotel/blockx

      # A published package pointing at files the build does not produce is the
      # failure mode this guards against - it happened during the tsup to tsdown
      # migration, where the output names changed from lib.js to lib.cjs.
      - name: Fail if the package points at files the build did not produce
        run: |
          node -e '
            const fs = require("fs");
            const pkg = require("./npm-package/package.json");
            const paths = new Set([pkg.main, pkg.module, pkg.types]);
            (function walk(o) {
              for (const v of Object.values(o)) {
                typeof v === "string" ? paths.add(v) : walk(v);
              }
            })(pkg.exports);
            const missing = [...paths].filter(
              (p) => !fs.existsSync("npm-package/" + p.replace(/^\.\//, ""))
            );
            if (missing.length) {
              console.error("missing build output: " + missing.join(", "));
              process.exit(1);
            }
            console.log("all " + paths.size + " referenced files exist");
          '
