name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax check (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README.txt declares Requires PHP: 8.1
        php-version: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint PHP files
        run: |
          find . -path ./wp-plugin/public/vendor -prune -o -path ./build -prune -o -name '*.php' -print0 \
            | xargs -0 -r -n1 php -l

  lint-npm-package:
    name: Type check the npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit over npm-package/src with strict, noUnusedLocals and
      # noUnusedParameters. This is the only type check in the repository: the
      # plugin bundle is JavaScript, and its @wordpress imports are externalised,
      # so webpack never checks them either.
      - name: Lint
        run: npm run lint --workspace @palasthotel/blockx

  build:
    name: Build both workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      # The plugin bundle imports @palasthotel/blockx, which npm resolves to the
      # local workspace, so the library has to be built first. The root script
      # does them in that order.
      - name: Build
        run: npm run build

      - name: Fail if the plugin bundle is missing
        run: test -f wp-plugin/public/assets/dist/gutenberg.js

      # A published package pointing at files the build does not produce is the
      # failure mode this guards against — it happened during the tsup to tsdown
      # migration, where the output names changed from lib.js to lib.cjs.
      - name: Fail if the package points at files the build did not produce
        run: |
          node -e '
            const fs = require("fs");
            const pkg = require("./npm-package/package.json");
            const paths = new Set([pkg.main, pkg.module, pkg.types]);
            (function walk(o) {
              for (const v of Object.values(o)) {
                typeof v === "string" ? paths.add(v) : walk(v);
              }
            })(pkg.exports);
            const missing = [...paths].filter(
              (p) => !fs.existsSync("npm-package/" + p.replace(/^\.\//, ""))
            );
            if (missing.length) {
              console.error("missing build output: " + missing.join(", "));
              process.exit(1);
            }
            console.log("all " + paths.size + " referenced files exist");
          '

  pack:
    name: Pack plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer

      - name: Pack
        run: npm ci && npm run pack
