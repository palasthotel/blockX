name: Update plugin version

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: read

jobs:
  # Runs on both release PRs. On the npm one the plugin's version and readme
  # changelog are already in place, so it commits nothing.
  sync-version:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-sync-version.yml@v1
    with:
      app-id: ${{ vars.RELEASE_BOT_APP_ID }}
      root: wp-plugin
    secrets: inherit
