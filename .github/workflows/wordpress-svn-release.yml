---
name: Build and release to WordPress.org

# The plugin's tags are plugin-v<version>: npm-package/ is released from the same
# repository as npm-v<version>.

on:
  push:
    tags:
      - "plugin-v*"
  # Re-run a failed deploy from a branch that has the fix - see
  # https://github.com/palasthotel/github-workflows/blob/main/docs/wp-plugin.md
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to deploy, without the prefix (e.g. 1.10.5)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-svn-deploy.yml@v1
    with:
      slug: blockx
      root: wp-plugin
      tag-prefix: plugin-v
      version: ${{ github.event.inputs.version }}
      # The editor bundle imports @palasthotel/blockx, which npm resolves to the
      # npm-package workspace - so install and build from the repository root,
      # library first. The command runs in wp-plugin/.
      build-command: cd .. && npm ci && npm run build
      # The plugin page's media live in the repository root, next to wp-plugin/
      assets-dir: assets
    secrets: inherit
